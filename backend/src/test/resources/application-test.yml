spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  auth:
    cookie-secure: true
  rate-limit:
    max-attempts: 5
  catalog:
    sync-cron: "-"
  collection:
    # Tests import cards and look at the result right away.
    cache-ttl: 0s
    snapshot-cron: "-"
