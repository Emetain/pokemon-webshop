spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=20000
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  # Fixed here, so a developer's own .env (an empty SHOP_EMAIL, another model) can't change what the tests expect.
  contact:
    email: shop@example.com
  mail:
    from: noreply@example.com
  openai:
    text-model: gpt-6.1-terra
    chat-model: gpt-6-luna
  auth:
    cookie-secure: true
  rate-limit:
    max-attempts: 5
  media:
    directory: build/test-media
  seo:
    index-file: classpath:seo/index.html
  catalog:
    sync-cron: "-"
    import-pokedex-on-start: false
  collection:
    # Tests import cards and look at the result right away.
    cache-ttl: 0s
    snapshot-cron: "-"
  shop:
    # Test sets come out in 2024 by default. A test that needs a set out of print gives it an older date.
    in-print-from:
      POKEMON: 2000-01-01
      MTG: 2000-01-01
      LORCANA: 2000-01-01
      ONE_PIECE: 2000-01-01
      RIFTBOUND: 2000-01-01
    popular-sets:
      POKEMON: [popular-a, popular-b]
  checkout:
    # Tests call the job themselves.
    release-cron: "-"
    cart-cleanup-cron: "-"
  drops:
    # Tests call the drop scheduler themselves.
    tick-cron: "-"
  payments:
    stripe:
      # The fake gateway in the tests never calls Stripe. The webhook secret signs test events.
      secret-key: sk_test_fake
      webhook-secret: whsec_test_secret
