spring:
  datasource:
    url: jdbc:h2:mem:pokemonwebshop;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=20000
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  auth:
    cookie-secure: false
  catalog:
    # The in-memory database starts empty anyway. Start a sync from the admin page when you need one.
    sync-cron: "-"
    import-pokedex-on-start: false
