spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pokemonwebshop}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:pokemonwebshop}
    password: ${DB_PASSWORD:pokemonwebshop}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  auth:
    # Local profile on plain http. Only prod requires the Secure flag.
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
