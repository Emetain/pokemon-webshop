spring:
  application:
    name: pokemon-webshop
  config:
    # The repo-root .env, whether the app starts from the root or from backend/.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  profiles:
    default: dev
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # The card sync writes tens of thousands of rows, so it needs batched statements.
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 200

server:
  port: 8080
  servlet:
    context-path: /api
  # Set to "native" behind a reverse proxy, otherwise every visitor shares the proxy's IP for rate limiting.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  # Public address of the frontend, used for links in emails.
  base-url: ${APP_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:noreply@example.com}
  auth:
    cookie-name: session
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    session-ttl: 30d
    password-reset-ttl: 1h
    cleanup-cron: "0 30 3 * * *"
  rate-limit:
    max-attempts: 10
    window: 1m
  media:
    # Where uploaded images are stored.
    directory: ${MEDIA_DIRECTORY:data/media}
  shop:
    # Cardmarket's public product list, read by the product import in admin. Only when an admin starts it.
    cardmarket:
      base-url: ${CARDMARKET_PRODUCTS_BASE_URL:https://downloads.s3.cardmarket.com}
      request-delay: 100ms
    # Sets released before this date are out of print: the shop leaves them out unless a product of theirs is in
    # stock, and the import skips them. No publisher announces when a set goes out of print, so this is the oldest
    # set still legal in the game's rotating format, which is when shops report a set running out. Checked on
    # 2026-11-08. Move a date when a format rotates and restart the backend.
    in-print-from:
      # Temporal Forces, the first set with regulation mark H. G (Scarlet & Violet up to Paldean Fates) left
      # Standard in April 2026, and shops report those sets out of print. Next rotation: spring 2027.
      POKEMON: 2024-03-22
      # Wilds of Eldraine, the oldest set in Standard. The rotation of February 2027 moves this to Aetherdrift
      # (2025-02-14), but keep Foundations (2024-11-15): Wizards keeps it in Standard until 2029.
      MTG: 2023-09-08
      # Fabled, set 9. Sets 1 to 8 are out of Core.
      LORCANA: 2025-08-29
      # Awakening of the New Era (OP-05), the first set of block 2. Block 1 (OP-01 to OP-04, ST-01 to ST-10) left
      # Standard in April 2026.
      ONE_PIECE: 2023-12-08
    # "Populair" and the bestsellers put the products sold most in this period first, then the popular sets below.
    bestseller-period: 90d
    # The most popular sets per game, most popular first, by set code. "Populair" puts these first after the products
    # customers bought here, and then the newest sets. Checked on 2026-11-08:
    # Pokémon on sealed prices against the shop price (rarepulltcg.com, August 2026), the rest on TCGplayer's sales.
    popular-sets:
      # 30th Celebration (pre-orders at three times the shop price), Delta Reign, Ascended Heroes, Prismatic
      # Evolutions, Black Bolt, White Flare, Phantasmal Flames, Destined Rivals, Mega Evolution, Journey Together,
      # Surging Sparks, Chaos Rising, Pitch Black, Perfect Order.
      # Delta Reign came out on 2026-11-06 and was added on 2026-11-09, in its launch week, when the newest set is
      # what customers ask for. It has no sealed prices to compare yet: move it once it has.
      POKEMON: [30th, 30th-c, me06, me02.5, sv08.5, sv10.5b, sv10.5w, me02, sv10, me01, sv09, sv08, me04, me05, me03]
      # TCGplayer, 17 August to 16 September 2026: The Hobbit, Secret Lair, Reality Fracture, The Hobbit Eternal,
      # Final Fantasy, The Lord of the Rings, Marvel Super Heroes and its Commander decks, Modern Horizons 3,
      # Final Fantasy Commander.
      MTG: [hob, sld, fra, hoc, fin, ltr, msh, msc, mh3, fic]
      # TCGplayer's best sellers of 2026 so far: Wilds Unknown, Winterspell, Attack of the Vine!
      LORCANA: ["12", "11", "13"]
      # TCGplayer, second and third quarter of 2026: The World's Strongest Warriors, Adventure on Kami's Island,
      # The Time of Battle, then The Azure Sea's Seven and Carrying On His Will.
      ONE_PIECE: [OP-17, OP15-EB04, OP-16, OP14-EB04, OP-13]
  checkout:
    # How long a checkout holds the stock while the customer pays. Stripe keeps its payment page open for at least
    # 30 minutes, so when this runs out the shop closes the Stripe page first and only then releases the stock.
    reservation-ttl: 15m
    # How often unpaid checkouts are checked, in Dutch time. "-" switches it off.
    release-cron: "0 * * * * *"
    guest-cart-ttl: 60d
    cart-cleanup-cron: "0 45 3 * * *"
    cart-cookie-name: cart
    # The link in the "shipped" mail. PostNL's is the format most Dutch shop plugins use (checked 2026-11-09). Other
    # carriers have no deep link we could confirm: the admin pastes the link from the shipping tool instead.
    tracking-urls:
      POSTNL: "https://jouw.postnl.nl/track-and-trace/{code}-{country}-{postcode}"
    # Created at startup for a country without a rate. Change them at /admin/verzending, not here.
    default-rates:
      NL:
        price-cents: 495
        free-from-cents: 7500
        delivery-time: 1 tot 2 werkdagen
      BE:
        price-cents: 895
        free-from-cents: 12500
        delivery-time: 2 tot 3 werkdagen
  payments:
    stripe:
      # Test mode locally: sk_test_... from the Stripe dashboard. Empty switches online payment off.
      secret-key: ${STRIPE_SECRET_KEY:}
      # whsec_... from "stripe listen" locally, or from the webhook endpoint in the Stripe dashboard.
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  catalog:
    # Fills the Pokédex right after startup instead of at the next Pokémon sync.
    import-pokedex-on-start: true
    # When the daily card sync starts, in Dutch time. "-" switches it off.
    sync-cron: ${CATALOG_SYNC_CRON:0 0 3 * * *}
    user-agent: UithoornTCG/1.0
    rate-limit-delay: 30s
    retry-delay: 2s
    tcgdex:
      base-url: ${TCGDEX_BASE_URL:https://api.tcgdex.net/v2}
      request-delay: 100ms
    scryfall:
      base-url: ${SCRYFALL_BASE_URL:https://api.scryfall.com}
      request-delay: 100ms
    lorcast:
      base-url: ${LORCAST_BASE_URL:https://api.lorcast.com/v0}
      request-delay: 100ms
    optcg:
      base-url: ${OPTCG_BASE_URL:https://optcgapi.com/api}
      request-delay: 1s
    ecb:
      base-url: ${ECB_BASE_URL:https://www.ecb.europa.eu}
      request-delay: 100ms
    pokeapi:
      base-url: ${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}
      request-delay: 200ms
  collection:
    # How long totals of the whole catalog and the most popular cards stay in memory.
    # They change slowly and are too costly to count on every request.
    cache-ttl: 10m
    # When the value of every collection is saved for the graph, in Dutch time. "-" switches it off.
    # Keep this after the card sync, which takes about an hour and a half.
    snapshot-cron: ${COLLECTION_SNAPSHOT_CRON:0 0 7 * * *}
