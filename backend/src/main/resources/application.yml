spring:
  application:
    name: pokemon-webshop
  lifecycle:
    timeout-per-shutdown-phase: 20s
  config:
    # The repo-root .env, whether the app starts from the root or from backend/.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  profiles:
    default: dev
  # Locally Mailpit catches everything and needs no login. A real mail provider needs MAIL_USERNAME, MAIL_PASSWORD,
  # MAIL_SMTP_AUTH=true and MAIL_SMTP_STARTTLS=true, usually on port 587. With STARTTLS on, a server that doesn't
  # offer it is refused instead of getting the password in plain text.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            required: ${MAIL_SMTP_STARTTLS:false}
          # Milliseconds. A slow mail server can't hold a thread for long.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # The card sync writes tens of thousands of rows, so it needs batched statements.
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 200

server:
  port: 8080
  # A deploy or restart lets running requests finish, such as a Stripe webhook or a checkout, for up to 20 seconds.
  # The container gets 30 (stop_grace_period in deploy/compose.yml).
  shutdown: graceful
  servlet:
    context-path: /api
  # Set to "native" behind a reverse proxy, otherwise every visitor shares the proxy's IP for rate limiting.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

# Only /api/actuator/health, without details. The deploy waits for it before it switches to a new version.
management:
  endpoints:
    web:
      exposure:
        include: health
      # No /api/actuator page that lists the endpoints.
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      # Spring Boot 4 adds the Kubernetes liveness and readiness groups by default. The deploy only needs the status.
      probes:
        enabled: false
  health:
    # Mail going down shouldn't make the shop count as down and roll a deploy back.
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  # Public address of the frontend, used for links in emails.
  base-url: ${APP_BASE_URL:http://localhost:5173}
  # Who gets in: "preview" (the closed preview behind one shared login, the default) or "open" (everyone). Caddy
  # reads the same variable for the login and robots.txt. The backend only accepts a Stripe test key in the preview
  # and a live key in the open shop; the other kind keeps online payment off (see StripeKeyRules).
  shop-access: ${SHOP_ACCESS:preview}
  # The business details in the footer of every page: iDEAL's rules and Dutch law ask for the KVK number on the site.
  # Empty shows nothing. Fill them in on the server once the shop is registered at the KVK.
  company:
    legal-name: ${COMPANY_LEGAL_NAME:}
    address: ${COMPANY_ADDRESS:}
    kvk-number: ${COMPANY_KVK_NUMBER:}
    vat-number: ${COMPANY_VAT_NUMBER:}
  # Ads from Google AdSense on the free card and news pages, never on shop, cart, checkout, drop or account pages.
  # "off" (the default) or "adsense". Caddy reads the same ADS for the Content-Security-Policy. The publisher id
  # (ca-pub-...) and the ids of the ad units come from the AdSense account; a place without an ad unit shows nothing.
  ads:
    mode: ${ADS:off}
    adsense-client: ${ADSENSE_CLIENT:}
    slot-catalog: ${ADSENSE_SLOT_CATALOG:}
    slot-content: ${ADSENSE_SLOT_CONTENT:}
  http:
    # The largest request body the API reads; larger ones get 413. Uploads are multipart and limited by
    # spring.servlet.multipart above. The longest text an admin can save is 50,000 characters. Caddy has the same limit.
    max-body-size: 256KB
  seo:
    # The built index.html of the frontend, for link previews of product, drop and news pages (SeoController). The
    # prod profile uses the copy in the backend image. Empty: those pages answer 404, which only matters behind Caddy.
    index-file: ${SEO_INDEX_FILE:}
  mail:
    from: ${MAIL_FROM:noreply@example.com}
  auth:
    cookie-name: session
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    session-ttl: 30d
    password-reset-ttl: 1h
    cleanup-cron: "0 30 3 * * *"
  rate-limit:
    max-attempts: 10
    window: 1m
    buckets:
      # Per email address, whether it has an account or not: failed logins (a correct password is refused too while
      # the limit holds), and reset mails. Against many IP addresses guessing one password or flooding one inbox.
      login-email:
        max-attempts: 10
        window: 15m
      forgot-password-email:
        max-attempts: 3
        window: 1h
      # Drops get their own limits. Per IP address they are generous, because a phone network can put hundreds of
      # people behind one address. Per account they are tight: one person needs only a few calls a minute.
      drop-join:
        max-attempts: 60
      drop-join-account:
        max-attempts: 6
      # The waiting room page asks every 2.5 to 15 seconds.
      drop-ping:
        max-attempts: 300
      drop-ping-account:
        max-attempts: 60
      drop-cart:
        max-attempts: 180
      drop-cart-account:
        max-attempts: 40
      drop-checkout:
        max-attempts: 30
      drop-checkout-account:
        max-attempts: 5
      drop-reminder:
        max-attempts: 10
      # Every checkout holds stock for 15 minutes, so this is tight. Together with app.checkout.max-open-per-*.
      checkout:
        max-attempts: 5
        window: 10m
      # A person signs up once. More per IP address would only be someone filling in other people's addresses.
      newsletter:
        max-attempts: 5
      # Customer service: a ticket, a reply on it, and questions to the chatbot. Each chatbot answer costs money.
      ticket:
        max-attempts: 3
        window: 10m
      ticket-reply:
        max-attempts: 10
        window: 10m
      support-chat:
        max-attempts: 20
        window: 10m
  media:
    # Where uploaded images are stored.
    directory: ${MEDIA_DIRECTORY:data/media}
  shop:
    # Cardmarket's public product list, read by the product import in admin. Only when an admin starts it.
    cardmarket:
      base-url: ${CARDMARKET_PRODUCTS_BASE_URL:https://downloads.s3.cardmarket.com}
      request-delay: 100ms
    # Sets released before this date are out of print: the shop leaves them out unless a product of theirs is in
    # stock, and the import skips them. No publisher announces when a set goes out of print, so this is the oldest
    # set still legal in the game's rotating format, which is when shops report a set running out. Checked on
    # 2026-11-08. Move a date when a format rotates and restart the backend.
    in-print-from:
      # Temporal Forces, the first set with regulation mark H. G (Scarlet & Violet up to Paldean Fates) left
      # Standard in April 2026, and shops report those sets out of print. Next rotation: spring 2027.
      POKEMON: 2024-03-22
      # Wilds of Eldraine, the oldest set in Standard. The rotation of February 2027 moves this to Aetherdrift
      # (2025-02-14), but keep Foundations (2024-11-15): Wizards keeps it in Standard until 2029.
      MTG: 2023-09-08
      # Fabled, set 9. Sets 1 to 8 are out of Core.
      LORCANA: 2025-08-29
      # Awakening of the New Era (OP-05), the first set of block 2. Block 1 (OP-01 to OP-04, ST-01 to ST-10) left
      # Standard in April 2026.
      ONE_PIECE: 2023-12-08
      # Riftbound has no rotation yet (checked 2026-11-12): every set since Origins (October 2025) is in print.
    # "Populair" and the bestsellers put the products sold most in this period first, then the popular sets below.
    bestseller-period: 90d
    # The most popular sets per game, most popular first, by set code. "Populair" puts these first after the products
    # customers bought here, and then the newest sets. Checked on 2026-11-08:
    # Pokémon on sealed prices against the shop price (rarepulltcg.com, August 2026), the rest on TCGplayer's sales.
    popular-sets:
      # 30th Celebration (pre-orders at three times the shop price), Delta Reign, Ascended Heroes, Prismatic
      # Evolutions, Black Bolt, White Flare, Phantasmal Flames, Destined Rivals, Mega Evolution, Journey Together,
      # Surging Sparks, Chaos Rising, Pitch Black, Perfect Order.
      # Delta Reign came out on 2026-11-06 and was added on 2026-11-09, in its launch week, when the newest set is
      # what customers ask for. It has no sealed prices to compare yet: move it once it has.
      POKEMON: [30th, 30th-c, me06, me02.5, sv08.5, sv10.5b, sv10.5w, me02, sv10, me01, sv09, sv08, me04, me05, me03]
      # TCGplayer, 17 August to 16 September 2026: The Hobbit, Secret Lair, Reality Fracture, The Hobbit Eternal,
      # Final Fantasy, The Lord of the Rings, Marvel Super Heroes and its Commander decks, Modern Horizons 3,
      # Final Fantasy Commander.
      MTG: [hob, sld, fra, hoc, fin, ltr, msh, msc, mh3, fic]
      # TCGplayer's best sellers of 2026 so far: Wilds Unknown, Winterspell, Attack of the Vine!
      LORCANA: ["12", "11", "13"]
      # TCGplayer, second and third quarter of 2026: The World's Strongest Warriors, Adventure on Kami's Island,
      # The Time of Battle, then The Azure Sea's Seven and Carrying On His Will.
      ONE_PIECE: [OP-17, OP15-EB04, OP-16, OP14-EB04, OP-13]
      # No sales ranking found for Riftbound (2026-11-12), so the newest main sets first: Radiance, Vendetta,
      # Unleashed, Spiritforged, Origins.
      RIFTBOUND: [RAD, VEN, UNL, SFD, OGN]
  checkout:
    # How long a checkout holds the stock while the customer pays. Stripe keeps its payment page open for at least
    # 30 minutes, so when this runs out the shop closes the Stripe page first and only then releases the stock.
    reservation-ttl: 15m
    # Shop checkouts that may wait for payment at the same time. Every checkout holds its stock, also for a guest, so
    # without a cap one visitor could keep the shop "Uitverkocht". Trying the same cart again closes the earlier
    # attempt first, so it doesn't count. Drops have their own limits. These are defaults: change them on the server
    # with the two variables.
    # Per customer: the account of a logged-in customer (so guest checkouts on their address can't block them), or
    # the email address of a guest.
    max-open-per-customer: ${CHECKOUT_MAX_OPEN_PER_CUSTOMER:2}
    # Per IP address: higher, because a phone network, a school or an office puts many customers behind one address.
    max-open-per-ip: ${CHECKOUT_MAX_OPEN_PER_IP:5}
    # How often unpaid checkouts are checked, in Dutch time. "-" switches it off.
    release-cron: "0 * * * * *"
    guest-cart-ttl: 60d
    cart-cleanup-cron: "0 45 3 * * *"
    cart-cookie-name: cart
    # The link in the "shipped" mail. PostNL's is the format most Dutch shop plugins use (checked 2026-11-09). Other
    # carriers have no deep link we could confirm: the admin pastes the link from the shipping tool instead.
    tracking-urls:
      POSTNL: "https://jouw.postnl.nl/track-and-trace/{code}-{country}-{postcode}"
    # Created at startup for a country without a rate. Change them at /admin/verzending, not here.
    default-rates:
      NL:
        price-cents: 495
        free-from-cents: 7500
        delivery-time: 1 tot 2 werkdagen
      BE:
        price-cents: 895
        free-from-cents: 12500
        delivery-time: 2 tot 3 werkdagen
  drops:
    # How often the drop scheduler looks at the clock: starts and ends drops, and lets the next batch through the
    # waiting room. In Dutch time. "-" switches it off.
    tick-cron: "* * * * * *"
    # The speed of the waiting room for a new drop. The admin changes it per drop, also during the drop.
    admit-per-minute: 60
    # The waiting room lets people through in batches this far apart.
    admit-interval: 10s
    # How long someone who got through may fill the drop cart and start a checkout.
    access-ttl: 10m
    # How long a drop checkout holds the stock. Shorter than the shop, so unpaid stock goes back to the line sooner.
    # Stripe's page stays open longer: the shop closes it first, as with normal checkouts.
    reservation-ttl: 10m
    # Someone whose page hasn't asked for this long has left: the next batch passes over their place. They keep it,
    # and get in as soon as they're back. Longer than a minute, because a browser tab that has been in the background
    # for a while runs its timers only once a minute.
    active-window: 75s
    waiting-room-opens: 30m
    # When the "herinner mij" mails go out, before the start.
    reminder-before: 15m
  contact:
    # Where new tickets and customer replies from /info/contact are mailed. Empty sends them to MAIL_FROM. Locally
    # Mailpit catches them. Becomes the shared shop mailbox once the shop has its own domain.
    email: ${SHOP_EMAIL:shop@example.com}
  newsletter:
    # How long the link in the confirmation mail works, and when signups that were never confirmed are removed.
    confirm-ttl: 7d
    pending-ttl: 30d
    cleanup-cron: "0 15 4 * * *"
  # Hero slides written by AI at /admin/hero. Without OPENAI_API_KEY the button is hidden and everything else works.
  # Models and prices checked on OpenAI's pricing page on 2026-11-12. The shop counts what every call costs from the
  # tokens OpenAI reports, and stops at the monthly limit. Also set a limit in OpenAI's dashboard.
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com/v1
    text-model: ${OPENAI_TEXT_MODEL:gpt-6.1-terra}
    image-model: ${OPENAI_IMAGE_MODEL:gpt-image-2.6-flare}
    image-size: 1536x1024
    image-quality: medium
    monthly-limit-usd: ${OPENAI_MONTHLY_LIMIT_USD:5}
    # US dollars per million tokens.
    text-input-per-million: 1.00
    text-output-per-million: 5.00
    # The chatbot on the contact page. A small model: at about 4,000 tokens a question, $3 is roughly 5,000
    # questions. Its own limit, apart from the hero slides. gpt-4o is not cheaper ($2.50 / $10) and OpenAI shuts it
    # down on 2027-01-14.
    chat-model: ${OPENAI_CHAT_MODEL:gpt-6-luna}
    chat-input-per-million: 0.10
    chat-output-per-million: 0.50
    chat-monthly-limit-usd: ${OPENAI_CHAT_MONTHLY_LIMIT_USD:3}
    image-text-input-per-million: 5.00
    image-output-per-million: 30.00
    # Counted before an image is made, so the last one of the month can't go over the limit. A medium
    # 1536x1024 image costs about $0.05.
    image-estimate-usd: 0.25
    timeout: 120s
  payments:
    stripe:
      # Test mode locally: sk_test_... from the Stripe dashboard. Empty switches online payment off.
      secret-key: ${STRIPE_SECRET_KEY:}
      # whsec_... from "stripe listen" locally, or from the webhook endpoint in the Stripe dashboard.
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  catalog:
    # Fills the Pokédex right after startup instead of at the next Pokémon sync.
    import-pokedex-on-start: true
    # When the daily card sync starts, in Dutch time. "-" switches it off.
    sync-cron: ${CATALOG_SYNC_CRON:0 0 3 * * *}
    # When the release calendar suggestions are refreshed from the card catalog and TCGplayer, after the sync.
    release-suggestion-cron: ${RELEASE_SUGGESTION_CRON:0 45 4 * * *}
    user-agent: Poketopia/1.0
    rate-limit-delay: 30s
    retry-delay: 2s
    tcgdex:
      base-url: ${TCGDEX_BASE_URL:https://api.tcgdex.net/v2}
      request-delay: 100ms
    scryfall:
      base-url: ${SCRYFALL_BASE_URL:https://api.scryfall.com}
      request-delay: 100ms
    lorcast:
      base-url: ${LORCAST_BASE_URL:https://api.lorcast.com/v0}
      request-delay: 100ms
    optcg:
      base-url: ${OPTCG_BASE_URL:https://optcgapi.com/api}
      request-delay: 1s
    # Riftbound: TCGplayer's catalog and prices, copied once a day by tcgcsv.com. It asks for a pause between calls.
    tcgcsv:
      base-url: ${TCGCSV_BASE_URL:https://tcgcsv.com}
      request-delay: 250ms
    ecb:
      base-url: ${ECB_BASE_URL:https://www.ecb.europa.eu}
      request-delay: 100ms
    pokeapi:
      base-url: ${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}
      request-delay: 200ms
  collection:
    # How long totals of the whole catalog and the most popular cards stay in memory.
    # They change slowly and are too costly to count on every request.
    cache-ttl: 10m
    # When the value of every collection is saved for the graph, in Dutch time. "-" switches it off.
    # Keep this after the card sync, which takes about an hour and a half.
    snapshot-cron: ${COLLECTION_SNAPSHOT_CRON:0 0 7 * * *}
