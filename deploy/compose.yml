# The shop on the server: the closed preview of phase 7, online without its login (SHOP_ACCESS=unlisted), and the
# live shop once SHOP_ACCESS=open (phase 10).
#
# Don't run this file by hand on the server: deploy.sh sets IMAGE_TAG to the commit, and compose.sh runs commands on
# the version that is live. Every version carries its own copy of this file inside its web image, so a deploy and a
# rollback always use the file that belongs to that version.
#
# Only the web container (Caddy) can be reached from outside. Postgres and the backend are on the internal network,
# and Mailpit's page only on the server itself. Everything restarts after a crash or a reboot. The memory limits keep
# the shop at about 3.5 GB, because the server also runs Minecraft.

name: poketopia

x-logging: &logging
  # Docker keeps container logs forever by default. This keeps 5 files of 10 MB per container.
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$$POSTGRES_USER\" --dbname=\"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 576m
    shm_size: 128m
    logging: *logging

  # Catches every mail while MAIL_HOST is mailpit, until a real mail provider is set in the .env. Its page is only on
  # the server itself: open an SSH tunnel.
  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 2000
    volumes:
      - mailpit-data:/data
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    mem_limit: 128m
    logging: *logging

  backend:
    image: ghcr.io/emetain/pokemon-webshop-backend:${IMAGE_TAG:?deploy.sh sets IMAGE_TAG}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # The Magic sync needs a heap of at least 2 GB. The container gets about 600 MB more for the rest of Java.
      JAVA_TOOL_OPTIONS: -Xms512m -Xmx${BACKEND_HEAP:-2g} -XX:+ExitOnOutOfMemoryError
      TZ: Europe/Amsterdam
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL in .env}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}
      # Caddy sets X-Forwarded-For, so rate limits see the visitor's IP address instead of Caddy's.
      FORWARD_HEADERS_STRATEGY: native
      MEDIA_DIRECTORY: /app/media
      # "preview" (the default) or "open", the same switch as for Caddy below. The backend only takes a Stripe test key
      # in the preview and a live key once the shop is open.
      SHOP_ACCESS: ${SHOP_ACCESS:-preview}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SHOP_EMAIL: ${SHOP_EMAIL:-}
      # The business details in the footer. Empty shows nothing.
      COMPANY_LEGAL_NAME: ${COMPANY_LEGAL_NAME:-}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}
      COMPANY_KVK_NUMBER: ${COMPANY_KVK_NUMBER:-}
      COMPANY_VAT_NUMBER: ${COMPANY_VAT_NUMBER:-}
      # Ads on the free card and news pages: "off" (the default) or "adsense", the same switch as for Caddy below.
      ADS: ${ADS:-off}
      ADSENSE_CLIENT: ${ADSENSE_CLIENT:-}
      ADSENSE_SLOT_CATALOG: ${ADSENSE_SLOT_CATALOG:-}
      ADSENSE_SLOT_CONTENT: ${ADSENSE_SLOT_CONTENT:-}
      # Checkouts waiting for payment at once, per customer and per IP address.
      CHECKOUT_MAX_OPEN_PER_CUSTOMER: ${CHECKOUT_MAX_OPEN_PER_CUSTOMER:-2}
      CHECKOUT_MAX_OPEN_PER_IP: ${CHECKOUT_MAX_OPEN_PER_IP:-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MONTHLY_LIMIT_USD: ${OPENAI_MONTHLY_LIMIT_USD:-5}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-6.1-terra}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2.6-flare}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-6-luna}
      OPENAI_CHAT_MONTHLY_LIMIT_USD: ${OPENAI_CHAT_MONTHLY_LIMIT_USD:-3}
      CATALOG_SYNC_CRON: ${CATALOG_SYNC_CRON:-0 0 3 * * *}
      RELEASE_SUGGESTION_CRON: ${RELEASE_SUGGESTION_CRON:-0 45 4 * * *}
      COLLECTION_SNAPSHOT_CRON: ${COLLECTION_SNAPSHOT_CRON:-0 0 7 * * *}
      TCGDEX_BASE_URL: ${TCGDEX_BASE_URL:-https://api.tcgdex.net/v2}
      SCRYFALL_BASE_URL: ${SCRYFALL_BASE_URL:-https://api.scryfall.com}
      LORCAST_BASE_URL: ${LORCAST_BASE_URL:-https://api.lorcast.com/v0}
      OPTCG_BASE_URL: ${OPTCG_BASE_URL:-https://optcgapi.com/api}
      TCGCSV_BASE_URL: ${TCGCSV_BASE_URL:-https://tcgcsv.com}
      ECB_BASE_URL: ${ECB_BASE_URL:-https://www.ecb.europa.eu}
      POKEAPI_BASE_URL: ${POKEAPI_BASE_URL:-https://pokeapi.co/api/v2}
      CARDMARKET_PRODUCTS_BASE_URL: ${CARDMARKET_PRODUCTS_BASE_URL:-https://downloads.s3.cardmarket.com}
    volumes:
      # Uploaded images. The volume stays when a new version starts.
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/api/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Flyway runs the migrations during the start.
      start_period: 240s
      start_interval: 5s
    stop_grace_period: 30s
    mem_limit: 2600m
    logging: *logging

  # Caddy: HTTPS with a Let's Encrypt certificate, the built frontend, and /api to the backend.
  web:
    image: ghcr.io/emetain/pokemon-webshop-web:${IMAGE_TAG:?deploy.sh sets IMAGE_TAG}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      # Optional: more addresses that redirect to SITE_ADDRESS, such as www.<domain>.
      SITE_ALIASES: ${SITE_ALIASES:-}
      # Who gets in: "preview" (the shared login, the default) or "open". Anything else stops Caddy. See the Caddyfile.
      SHOP_ACCESS: ${SHOP_ACCESS:-preview}
      # "off" (the default) or "adsense": lets Google's ad scripts through the Content-Security-Policy. Anything else
      # stops Caddy.
      ADS: ${ADS:-off}
      # The preview login. Keep them in the .env after opening, so going back to the preview is one switch.
      PREVIEW_USER: ${PREVIEW_USER:?set PREVIEW_USER in .env}
      PREVIEW_PASSWORD_HASH: ${PREVIEW_PASSWORD_HASH:?set PREVIEW_PASSWORD_HASH in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # HTTP/3
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # Certificates. Keeping them avoids asking Let's Encrypt again at every deploy.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 192m
    logging: *logging

volumes:
  postgres-data:
  media:
  mailpit-data:
  caddy-data:
  caddy-config:
