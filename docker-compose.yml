services:
  postgres:
    image: postgres:16-alpine
    container_name: pokemon-webshop-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pokemonwebshop}
      POSTGRES_USER: ${POSTGRES_USER:-pokemonwebshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokemonwebshop}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokemonwebshop} -d ${POSTGRES_DB:-pokemonwebshop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: pokemon-webshop-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    container_name: pokemon-webshop-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build: ./backend
    container_name: pokemon-webshop-backend
    profiles: ["full"]
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pokemonwebshop}
      DB_USERNAME: ${POSTGRES_USER:-pokemonwebshop}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pokemonwebshop}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-noreply@example.com}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-none}
      TCGDEX_BASE_URL: ${TCGDEX_BASE_URL:-https://api.tcgdex.net/v2}
      SCRYFALL_BASE_URL: ${SCRYFALL_BASE_URL:-https://api.scryfall.com}
      LORCAST_BASE_URL: ${LORCAST_BASE_URL:-https://api.lorcast.com/v0}
      OPTCG_BASE_URL: ${OPTCG_BASE_URL:-https://optcgapi.com/api}
      TCGCSV_BASE_URL: ${TCGCSV_BASE_URL:-https://tcgcsv.com}
      ECB_BASE_URL: ${ECB_BASE_URL:-https://www.ecb.europa.eu}
      POKEAPI_BASE_URL: ${POKEAPI_BASE_URL:-https://pokeapi.co/api/v2}
      CARDMARKET_PRODUCTS_BASE_URL: ${CARDMARKET_PRODUCTS_BASE_URL:-https://downloads.s3.cardmarket.com}
      CATALOG_SYNC_CRON: ${CATALOG_SYNC_CRON:-0 0 3 * * *}
      RELEASE_SUGGESTION_CRON: ${RELEASE_SUGGESTION_CRON:-0 45 4 * * *}
      COLLECTION_SNAPSHOT_CRON: ${COLLECTION_SNAPSHOT_CRON:-0 0 7 * * *}
      MEDIA_DIRECTORY: /app/media
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SHOP_EMAIL: ${SHOP_EMAIL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MONTHLY_LIMIT_USD: ${OPENAI_MONTHLY_LIMIT_USD:-5}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-6.1-terra}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2.6-flare}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-6-luna}
      OPENAI_CHAT_MONTHLY_LIMIT_USD: ${OPENAI_CHAT_MONTHLY_LIMIT_USD:-3}
      OPENAI_SCAN_MODEL: ${OPENAI_SCAN_MODEL:-gpt-6-luna}
      OPENAI_SCAN_MONTHLY_LIMIT_USD: ${OPENAI_SCAN_MONTHLY_LIMIT_USD:-5}
      SHOP_ACCESS: ${SHOP_ACCESS:-preview}
      CHECKOUT_MAX_OPEN_PER_CUSTOMER: ${CHECKOUT_MAX_OPEN_PER_CUSTOMER:-2}
      CHECKOUT_MAX_OPEN_PER_IP: ${CHECKOUT_MAX_OPEN_PER_IP:-5}
      COMPANY_LEGAL_NAME: ${COMPANY_LEGAL_NAME:-}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}
      COMPANY_KVK_NUMBER: ${COMPANY_KVK_NUMBER:-}
      COMPANY_VAT_NUMBER: ${COMPANY_VAT_NUMBER:-}
    volumes:
      - media-data:/app/media
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  media-data:
