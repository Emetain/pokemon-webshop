services:
  postgres:
    image: postgres:16-alpine
    container_name: pokemon-webshop-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pokemonwebshop}
      POSTGRES_USER: ${POSTGRES_USER:-pokemonwebshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokemonwebshop}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokemonwebshop} -d ${POSTGRES_DB:-pokemonwebshop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: pokemon-webshop-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    container_name: pokemon-webshop-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build: ./backend
    container_name: pokemon-webshop-backend
    profiles: ["full"]
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pokemonwebshop}
      DB_USERNAME: ${POSTGRES_USER:-pokemonwebshop}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pokemonwebshop}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      TCGDEX_BASE_URL: ${TCGDEX_BASE_URL:-https://api.tcgdex.net/v2}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
